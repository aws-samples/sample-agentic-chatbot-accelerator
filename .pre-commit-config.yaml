repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-case-conflict
      - id: check-merge-conflict

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.24.1
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/crate-ci/typos
    rev: v1.31.1
    hooks:
      - id: typos
        # Cargo.lock is crate names and 64-hex checksums, not prose.
        exclude: '(.*\.svg$|^cli/Cargo\.lock$)'

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black

  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.5
    hooks:
      - id: ruff
        args: [--config=pyproject.toml]

  - repo: local
    hooks:
      - id: terraform-fmt
        name: Terraform format
        entry: make tf-fmt
        language: system
        files: ^iac-terraform/.*\.tf$
        pass_filenames: false
      - id: terraform-validate
        name: Terraform validate
        entry: make tf-validate
        language: system
        files: ^iac-terraform/.*\.tf$
        pass_filenames: false
      # `cd cli` rather than `--manifest-path`: rustup picks the toolchain from the
      # *working directory*, so running cargo from the repo root ignores
      # cli/rust-toolchain.toml and a contributor on a pre-1.94.1 default gets the
      # confusing SDK errors the pin exists to prevent. It also keeps these hooks
      # identical to `make cli-lint`, which cds in.
      - id: rust-fmt
        name: Rust format
        entry: bash -c 'cd cli && cargo fmt --'
        language: system
        files: ^cli/.*\.rs$
        pass_filenames: false
      # clippy and cargo-audit are manual-stage: a cold AWS-SDK + ratatui + tokio
      # build takes minutes, which would make every commit painful.
      # Run with: pre-commit run --hook-stage manual rust-clippy
      - id: rust-clippy
        name: Rust clippy
        entry: bash -c 'cd cli && cargo clippy --all-targets -- -D warnings'
        language: system
        files: ^cli/.*\.(rs|toml)$
        pass_filenames: false
        stages: [manual]
      - id: cargo-audit
        name: cargo audit
        entry: bash -c 'cd cli && cargo audit'
        language: system
        files: ^cli/Cargo\.lock$
        pass_filenames: false
        stages: [manual]

  - repo: https://github.com/bridgecrewio/checkov.git
    rev: 3.2.484
    hooks:
      - id: checkov
        name: Checkov Terraform scan
        args: [
          '--framework', 'terraform',
          '--directory', 'iac-terraform/',
          '--compact',
          '--quiet'
        ]
        files: ^iac-terraform/
        stages: [manual]  # Run with: pre-commit run checkov --hook-stage manual

  - repo: https://github.com/awslabs/automated-security-helper.git
    rev: v3.5.3
    hooks:
    - id: ash
      name: scan files using ash
      stages: [ manual ]
      args: ['--scanners', 'checkov,npm-audit,bandit,detect-secrets,cdk-nag,semgrep']
