projects:
  chatbot:
    schemaPath: ../src/api/schema/schema.graphql
    includes:
      - ../src/user-interface/react-app/src/graphql/*.ts
    excludes:
      - ./amplify/**
    extensions:
      amplify:
        codeGenTarget: typescript
        generatedFileName: ../src/user-interface/react-app/src/API.ts
        docsFilePath: ../src/user-interface/react-app/src/graphql/
        region: us-east-1
        apiId: null
        frontend: javascript
        framework: react
        # Depth 3 is required so generated queries include nested sub-selections
        # like EvaluatorRun.results.repetitions { ... }. At depth 2 codegen
        # silently drops them, breaking the per-repetition run view.
        maxDepth: 3
extensions:
  amplify:
    version: 3
