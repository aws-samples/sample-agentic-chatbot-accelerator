# yaml-language-server: $schema=https://raw.githubusercontent.com/awslabs/automated-security-helper/refs/heads/main/automated_security_helper/schemas/AshConfig.json
project_name: agentic-chatbot-accelerator
fail_on_findings: true

global_settings:
  severity_threshold: MEDIUM
  ignore_paths:
    # Terraform state / downloaded modules
    - path: 'iac-terraform/.terraform/'
      reason: 'Downloaded Terraform modules'
    - path: 'iac-terraform/terraform.tfstate'
      reason: 'Terraform state file'
    - path: 'iac-terraform/terraform.tfstate.backup'
      reason: 'Terraform state backup'

    # Lambda build artifacts (vendored Python deps zipped for upload, not source)
    - path: '**/iac-terraform/build/**'
      reason: 'Terraform Lambda package build dirs — vendored third-party deps'
    - path: '**/iac-terraform/modules/knowledge_base/build/**'
      reason: 'create-vector-index Lambda package — vendored opensearchpy/urllib3/google.protobuf'

    # CDK synth output, Lambda asset bundles, and node_modules
    - path: '**/cdk.out/**'
      reason: 'CDK synthesized templates and Lambda asset bundles — generated outputs, not source. Glob form matches the absolute paths checkov reports (it mounts the source as /).'
    - path: '**/node_modules/**'
      reason: 'Third-party dependencies'

    # React frontend (covered by npm-audit, not file scanners)
    - path: 'src/user-interface/react-app/dist/'
      reason: 'Vite build output'

    # Python tooling caches and venvs
    - path: '**/.venv/**'
      reason: 'Python virtual environment'
    - path: '**/venv/**'
      reason: 'Python virtual environment'
    - path: '**/.ruff_cache/**'
      reason: 'Ruff cache — high-entropy hashes in CACHEDIR.TAG, not secrets'
    - path: '**/.pytest_cache/**'
      reason: 'Pytest cache — high-entropy hash in CACHEDIR.TAG, not a secret (same as .ruff_cache)'

    # ASH itself
    - path: '.ash/'
      reason: 'ASH working directory and config'
    - path: '**/ash_output/**'
      reason: 'ASH scan output (also covers container path)'

    # Local, gitignored config files (present in the working tree, not in the
    # repo / CI checkout — high-entropy runtime IDs read as secrets)
    - path: 'iac-cdk/bin/config-demo.yaml'
      reason: 'Gitignored local demo config — AgentCore runtime IDs, not secrets'
    - path: 'iac-cdk/bin/config.yaml'
      reason: 'Gitignored local deploy config — AgentCore runtime IDs, not secrets'

    # Repo caches and docs assets
    - path: 'cache/'
      reason: 'Local build/runtime cache'
    - path: 'docs/imgs/'
      reason: 'Documentation images'
    - path: 'docs/gifs/'
      reason: 'Documentation animations'

    # Claude
    - path: '.claude/'
      reason: 'AI coding assistant configuration'
    - path: 'CLAUDE.md'
      reason: 'AI coding assistant configuration'

  # Per-finding suppressions (rule_id + path) — distinct from ignore_paths
  # (which drop whole files); these keep the file scanned but silence one rule.
  suppressions:
    # semgrep supply-chain rule suggesting `exclude-newer` under [tool.uv]. The
    # relative-duration form ("7 days") requires uv >= 0.9.17, but the repo / CI
    # / tooling images are not yet pinned there; adding it breaks
    # uv lock/sync/run on older uv with a cryptic date-parse error. Revisit
    # (add the cooldown) once uv is bumped to >= 0.9.17 everywhere.
    # ASH matches `path` with fnmatch against the repo-relative finding path, so
    # `*pyproject.toml` covers both the root `pyproject.toml` and the nested
    # `src/agent-core/*/pyproject.toml` (a `**/` prefix would miss the bare root).
    - rule_id: 'package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown'
      path: '*pyproject.toml'
      reason: 'exclude-newer relative-duration needs uv>=0.9.17; repo/CI not yet pinned there. Tracked as a follow-up.'

    # detect-secrets high-entropy hits in the `cli/` Rust crate. Every one is a
    # test fixture or a lookup table, and each is pinned to its exact line so
    # detect-secrets keeps scanning the rest of these files — they are the ones
    # that handle real tokens at runtime, so blanket-silencing a whole file here
    # would remove the check exactly where it matters most.
    - rule_id: 'SECRET-HEX-HIGH-ENTROPY-STRING'
      path: 'cli/src/args.rs'
      line_start: 254
      line_end: 254
      reason: 'Fake 33-char session id in a clap parsing test. Session ids are not credentials; AgentCore rejects ids shorter than 33 chars, which is what this test pins.'
    - rule_id: 'SECRET-BASE64-HIGH-ENTROPY-STRING'
      path: 'cli/src/auth/login.rs'
      line_start: 402
      line_end: 402
      reason: 'The base64url alphabet constant (A-Za-z0-9-_) used by the hand-rolled encoder in a test helper. A lookup table, not a secret.'
    - rule_id: 'SECRET-BASE64-HIGH-ENTROPY-STRING'
      path: 'cli/tests/presign.rs'
      line_start: 44
      line_end: 45
      reason: "AWS's own documentation example secret key plus a fake session token, used to generate the golden SigV4 fixture with a fixed clock. Both are public example values; a real credential would make the fixture unreproducible."
    - rule_id: 'SECRET-HEX-HIGH-ENTROPY-STRING'
      path: 'cli/src/telemetry.rs'
      line_start: 352
      line_end: 352
      reason: 'A made-up hex signature used to assert that URL redaction actually removes signatures from the log. The test would be pointless without a signature-shaped string.'
    - rule_id: 'SECRET-HEX-HIGH-ENTROPY-STRING'
      path: 'cli/src/protocol.rs'
      line_start: 323
      line_end: 323
      reason: 'RFC 4122 example UUID with hyphens stripped, pinning that a 32-char id is rejected. A UUID is an identifier, not a credential.'

converters:
  archive:
    enabled: false

scanners:
  bandit:
    enabled: true
  checkov:
    enabled: true
  detect-secrets:
    enabled: true
  semgrep:
    enabled: true
  npm-audit:
    enabled: true
  cdk-nag:
    enabled: true
