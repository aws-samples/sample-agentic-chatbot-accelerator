[project]
name = "aca-agent-graph"
version = "2.0.0"
description = "AgentCore directed-graph workflow container dependencies."
requires-python = ">=3.13"
dependencies = [
    "langgraph==1.2.11",
    "strands-agents[a2a]==1.50.1",
    "mcp-proxy-for-aws==1.7.0",
    "pydantic==2.13.5",
    # Upper bound is load-bearing — see src/agent-core/docker/pyproject.toml for why
    # this pin and strands-agents have to move together.
    "bedrock-agentcore>=1.18.1,<1.19",
    "boto3>=1.42.86",
    "httpx>=0.27.0",
    "aws-opentelemetry-distro==0.15.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
package = false
